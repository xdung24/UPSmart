# YAML keys match CLI long flags; CLI values take precedence.
schema-version: 1
poll-interval: 2s
transaction-timeout: 1s
stale-after: 10s
monitoring-enabled: false

# Windows service installation automatically configures desktop IPC for the
# installing account. Normal upsdesktop use does not require Administrator.
# For a different desktop account, specify its SID and the service policy path:
# desktop-user-sid: S-1-5-21-EXAMPLE-REPLACE-WITH-REAL-SID
# desktop-settings-file: 'C:\ProgramData\UPSmart\logs\desktop-policy.json'

# Optional rdpwatcher relay (omit direct Telegram credentials).
# notify-addr: 127.0.0.1:50061
# telegram-events: [startup, power_changed, connection_error]
